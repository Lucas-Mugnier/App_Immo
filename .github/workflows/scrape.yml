name: Refresh listings

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: browser-actions/setup-chrome@v1

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraping pipeline
        run: xvfb-run -a python pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "immo-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard-react/src/data/*.json dvf/listings_market.db
          git diff --cached --quiet || git commit -m "chore: refresh listings data"
          git push
