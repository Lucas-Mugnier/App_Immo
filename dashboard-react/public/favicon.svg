<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a855"/>
      <stop offset="100%" stop-color="#b8873a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)" stroke="#2a2a4a" stroke-width="0.5"/>

  <!-- Far mountain (left) - muted -->
  <path d="M2,24 L8,12 L14,22 L2,24Z" fill="#2a2a4a" opacity="0.7"/>

  <!-- Far mountain (right) - muted -->
  <path d="M18,24 L24,14 L30,24 L18,24Z" fill="#2a2a4a" opacity="0.7"/>

  <!-- Main peak (center, tallest) -->
  <path d="M10,26 L16,5 L22,26 Z" fill="url(#gold)"/>

  <!-- Snow cap on main peak -->
  <path d="M16,5 L13.2,13 L16,11.5 L18.8,13 Z" fill="url(#snow)"/>

  <!-- "A" letterform carved into peak via negative space effect - left facet darker -->
  <path d="M10,26 L16,5 L16,5 L13,16 L13,26 Z" fill="#9a6422" opacity="0.4"/>

  <!-- Crossbar of A -->
  <rect x="12.5" y="17.5" width="7" height="1.2" rx="0.6" fill="#9a6422" opacity="0.5"/>

  <!-- Base line -->
  <rect x="4" y="25" width="24" height="1" rx="0.5" fill="url(#gold)" opacity="0.3"/>
</svg>
